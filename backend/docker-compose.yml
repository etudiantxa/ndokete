services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ndokete_db
      POSTGRES_USER: ndokete
      POSTGRES_PASSWORD: ndokete123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ndokete']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    build: .
    ports:
      - '4000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://ndokete:ndokete123@postgres:5432/ndokete_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=9d132a955e3253d08861a8b70e4db9a3b637088a99c6bc5a51868799164f5409
      - JWT_REFRESH_SECRET=9ceddbcfc3b83c8de5e43f7f429a0526b3387611b7c9c2ddb9228a857b6d85f6
      - JWT_ACCESS_EXPIRES=60m
      - JWT_REFRESH_EXPIRES=7d
      - CLOUDINARY_CLOUD_NAME=your_cloud_name
      - CLOUDINARY_API_KEY=your_api_key
      - CLOUDINARY_API_SECRET=your_api_secret
      - FIREBASE_PROJECT_ID=ndokete-firebase
      - FIREBASE_PRIVATE_KEY=private_key
      - FIREBASE_CLIENT_EMAIL=email@ndokete.iam.gserviceaccount.com
      - NDOKETE_COMMISSION_PCT=10
      - CORS_ORIGINS=http://localhost:3000,http://localhost:4000,http://localhost:5000,https://ndokete.app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── Adminer (interface web pour voir la BDD) ──────────────────────────────
  adminer:
    image: adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
