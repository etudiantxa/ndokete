name: ndokete
description: NDOKETE — Plateforme mobile pour artisans sénégalais (SaaS + Marketplace)
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Architecture ──────────────────────────────────────────────────────────
  flutter_bloc: ^8.1.5
  get_it: ^7.7.0
  injectable: ^2.4.1
  go_router: ^14.2.7

  # ── Réseau ────────────────────────────────────────────────────────────────
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  connectivity_plus: ^6.0.5

  # ── Stockage local (offline-first) ───────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Sérialisation ─────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── UI ────────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  timeago: ^3.6.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # ── Paiements & Notifications ─────────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  socket_io_client: ^2.0.3+1

  # ── PDF ───────────────────────────────────────────────────────────────────
  pdf: ^3.10.8
  printing: ^5.12.0

  # ── Utilitaires ───────────────────────────────────────────────────────────
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.0
  logger: ^2.4.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  record: ^6.1.2
  audioplayers: ^6.6.0
  cross_file: ^0.3.5+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
